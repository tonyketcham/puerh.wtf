name: Geo

# Origin map pipeline guards (docs/relational-plan.md §4.3.1). Neither job touches the network
# beyond installing deps: geo:check hashes inputs against the committed manifest, and geo:test
# runs the real pipeline on a 4-tile fixture and compares it byte for byte on every OS.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  geo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter puerh.wtf geo:check

  geo-test:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter puerh.wtf geo:test
