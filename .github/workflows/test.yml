name: Playwright Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test authoring service
        run: pnpm --filter puerh.wtf cms:test

      - name: Install Playwright Browsers
        run: pnpm --filter puerh.wtf exec playwright install --with-deps

      - name: Check the static export server
        run: pnpm --filter puerh.wtf test:server

      - name: Run development Playwright tests
        run: pnpm --filter puerh.wtf test:dev

      - name: Build the static export with test fixtures
        run: pnpm --filter puerh.wtf build
        env:
          PUERH_TEST_FIXTURES: "1"

      - name: Run static export Playwright tests
        run: pnpm --filter puerh.wtf test:export

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: app/test-results/
          retention-days: 30

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 30
